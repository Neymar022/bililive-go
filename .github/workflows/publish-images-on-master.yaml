name: Publish Docker Images On Master

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish
        required: false
        default: master

env:
  APP_IMAGE: neymar022/bililive-go-app
  WORKER_IMAGE: neymar022/bililive-go-subtitle-worker

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker metadata for app image
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.build-and-run
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}

      - name: Resolve subtitle worker context
        id: worker-context
        shell: bash
        run: |
          if [ -f workers/subtitle-worker/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "context=./workers/subtitle-worker" >> "$GITHUB_OUTPUT"
            echo "file=./workers/subtitle-worker/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f contrib/subtitle-worker/Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "context=./contrib/subtitle-worker" >> "$GITHUB_OUTPUT"
            echo "file=./contrib/subtitle-worker/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::subtitle worker context is not present on this ref; skipping worker image publish"
          fi

      - name: Docker metadata for subtitle worker image
        if: steps.worker-context.outputs.exists == 'true'
        id: worker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push subtitle worker image
        if: steps.worker-context.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.worker-context.outputs.context }}
          file: ${{ steps.worker-context.outputs.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.worker-meta.outputs.tags }}
          labels: ${{ steps.worker-meta.outputs.labels }}
